# Decap CMS 設定 — 網頁後台編輯內容
#
# 線上後台（https://isocyclo.com/admin/）：透過 GitHub 登入（OAuth 由 Cloudflare Pages Functions 提供），
# 存檔會直接 commit 到 repo，Cloudflare Pages 自動重新部署（約 1–2 分鐘生效）。
# 本機後台：在 site/ 目錄跑 `npx decap-server` 後開 http://localhost:4322/admin/index.html
local_backend: true
backend:
  name: github
  repo: a235689741023/isocyclo-website
  branch: main
  base_url: https://isocyclo.com
  auth_endpoint: /api/auth

locale: zh_Hant
site_url: https://isocyclo.com
media_folder: site/public/uploads
public_folder: /uploads

collections:
  - name: about
    label: 個人簡介
    files:
      - file: site/src/content/about/profile.md
        name: profile
        label: 照片與自我介紹
        fields:
          - { name: name, label: 名字（英文名 + 別名）, widget: string }
          - { name: nameEn, label: 英文名, widget: string, required: false }
          - { name: chineseName, label: 中文名字, widget: string, required: false }
          - { name: photo, label: 個人照片, widget: image, default: /uploads/profile-placeholder.svg }
          - { name: tagline, label: 一句話簡介, widget: string, required: false }
          - { name: subline, label: 副標, widget: string, required: false }
          - { name: email, label: Email, widget: string, required: false }
          - { name: linkedin, label: LinkedIn 網址, widget: string, required: false }
          - { name: g0vSlack, label: g0v Slack 帳號, widget: string, required: false }
          - name: education
            label: 教育
            widget: list
            required: false
            fields:
              - { name: school, label: 學校, widget: string }
              - { name: dept, label: 系所, widget: string }
              - { name: year, label: 期間, widget: string }
          - { name: languages, label: 語言（每列一項）, widget: list, required: false }
          - { name: skills, label: 技能（每列一項）, widget: list, required: false }
          - name: awards
            label: 其他競賽獎項
            widget: list
            required: false
            fields:
              - { name: title, label: 名稱, widget: string }
              - { name: year, label: 年份, widget: string }

  - name: thoughts
    label: 所思所想
    label_singular: 文章
    folder: site/src/content/thoughts
    create: true
    slug: "{{slug}}"
    fields:
      - { name: title, label: 標題, widget: string }
      - { name: date, label: 日期, widget: datetime, format: "YYYY-MM-DD", time_format: false }
      - { name: category, label: 分類, widget: string, default: 隨筆 }
      - { name: description, label: 一句話摘要, widget: string, required: false }
      - { name: draft, label: 草稿（勾選則不公開）, widget: boolean, default: false }
      - { name: body, label: 內文, widget: markdown }

  - name: works
    label: 文字作品
    label_singular: 作品
    folder: site/src/content/works
    create: true
    fields:
      - { name: title, label: 標題, widget: string }
      - { name: platform, label: 刊登平台, widget: string, hint: "例如：報導者、換日線、VERSE" }
      - { name: date, label: 發表日期, widget: datetime, format: "YYYY-MM-DD", time_format: false }
      - { name: url, label: 原文連結, widget: string, required: false }
      - { name: note, label: 一句話介紹, widget: string, required: false }
      - { name: body, label: 內文（填了就會在站內顯示全文，適合紙本作品；留空則點標題連往原文）, widget: markdown, required: false }

  - name: experience
    label: 經歷成果
    label_singular: 經歷
    folder: site/src/content/experience
    create: true
    fields:
      - name: category
        label: 類別
        widget: select
        options: [研究, 寫作, 轉譯, 策展, 專案, 開源, 教學]
      - { name: title, label: 標題, widget: string }
      - { name: subtitle, label: 單位／獎項／場合, widget: string, required: false }
      - { name: year, label: 年份, widget: string, hint: "例如：2024 – 現在" }
      - { name: featured, label: 重點呈現（會標★並排在前面）, widget: boolean, default: false }
      - { name: order, label: 排序（小的在前）, widget: number, default: 0 }
      - { name: body, label: 說明, widget: markdown, required: false }

  - name: topics
    label: 留言板話題
    label_singular: 話題
    folder: site/src/content/topics
    create: true
    fields:
      - { name: title, label: 話題標題, widget: string }
      - { name: date, label: 日期, widget: datetime, format: "YYYY-MM-DD", time_format: false }
      - { name: body, label: 話題內文, widget: markdown }

  - name: status
    label: 近況狀態
    label_singular: 狀態
    folder: site/src/content/status
    create: true
    fields:
      - name: kind
        label: 類型
        widget: select
        options:
          - { label: 最近在讀, value: READ }
          - { label: 最近在看, value: WATCH }
          - { label: 最近嘗試, value: TRY }
      - { name: text, label: 內容, widget: string }
      - { name: date, label: 日期, widget: datetime, format: "YYYY-MM-DD", time_format: false }
      - { name: body, label: （不使用）, widget: hidden, required: false }
